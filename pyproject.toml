[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventvault-r"
version = "0.1.0"
description = "Progressive, uncertainty-bounded science-data escrow for CubeSat astronomy"
authors = [
    {name = "Om Awthankar"},
    {name = "Dax Shah"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyWavelets>=1.4",
    "astropy>=5.3",
    "photutils>=1.8",
    "sep-pjw>=1.2",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["eventvault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
